    post:
      operationId: domainCreate
      summary: Register the domain
      description: "Register a specific domain.\n\n### Required Permissions \n\n - <a href=\"#scopes/domains:billing\">domains:billing</a>\n\n### Rate Limits \n\n * The limit to register domains is 30 requests per user, within 30 seconds."
      parameters:
      - name: domain
        in: path
        required: true
        description: The domain name for registration.
        schema:
          type: string
          example: spaceship.com
          minLength: 4
          maxLength: 255
          format: domain
          description: Domain name in UTF-8 or ASCII format (U-label or A-label)
      responses:
        '202':
          description: Async operation was created as a result of request processing.
          headers:
            spaceship-async-operationid:
              required: true
              description: Unique async operation identifier. Use this reference to [Obtain async operation details](#tag/Async-Operations/operation/getAsyncOperationDetails).
              schema:
                type: string
                pattern: ^[a-zA-Z0-9]+$
                maxLength: 36
