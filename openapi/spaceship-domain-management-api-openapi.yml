components:
  schemas:
    fqdn:
      type: string
      example: ns1.spaceship.dev
      minLength: 4
      maxLength: 255
      format: hostname
    domainNameULabel:
      type: string
      example: spaceship.com
      minLength: 4
      maxLength: 255
      format: domain
      description: Domain name in UTF-8 format (U-label)
    DomainClientEPPStatus:
      type: string
      enum:
      - clientDeleteProhibited
      - clientHold
      - clientRenewProhibited
      - clientTransferProhibited
      - clientUpdateProhibited
    domainNameALabel:
      type: string
      example: xn--spceship-9ya.com
      minLength: 4
      maxLength: 255
      format: domain
      description: Domain name in ASCII format (A-label)
    operationId:
      type: string
      maxLength: 16
      pattern: ^[a-z0-9]{16}$
      description: 16-characters unique identifier of the operation
    DomainLifecycleStatus:
      type: string
      enum:
      - creating
      - registered
      - grace1
      - grace2
      - redemption
    ErrorDetail:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
          pattern: ^[\s|\S]*$
          description: A general message about the exception
          readOnly: true
    DomainPrivacyProtection:
      type: object
      required:
      - contactForm
      - level
      properties:
        contactForm:
          type: boolean
          example: true
          description: Indicates whether WHOIS should display the contact form link
        level:
          allOf:
          - $ref: '#/components/schemas/DomainPrivacyLevel'
          example: high
          description: Level of privacy protection set for the domain
    DomainContacts:
      type: object
      required:
      - registrant
      properties:
        registrant:
          allOf:
          - $ref: '#/components/schemas/contactId'
          description: ID of the registrant contact person
        admin:
          allOf:
          - $ref: '#/components/schemas/contactId'
          description: ID of the admin contact person
        tech:
          allOf:
          - $ref: '#/components/schemas/contactId'
          description: ID of the technical contact person
        billing:
          allOf:
          - $ref: '#/components/schemas/contactId'
          description: ID of the billing contact person
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/contactId'
          example:
          - 1ZdMXpapqp9sle5dl8BlppTJXAzf3
          - 1ZdMXpapqp9sle5dl8BlppTJXAzf2
          maxItems: 5
          description: List of extended attribute contact point IDs
      description: Domain Contacts presented as ID references
    isoDate:
      type: string
      example: '2100-01-01T00:00:00.000Z'
      maxLength: 27
      format: date-time
      description: ISO-8601 DateTime
    DomainVerificationStatus:
      type: string
      enum:
      - verification
      - success
      - failed
      example: success
      description: 'Status of the RAA verification process. Possible values are:

        * `verification` - Verification process is in progress and requires user interaction.

        * `success` - Verification success.

        * `failed` - Verification failed.'
    ObjectNotFoundError:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
          pattern: ^[\s|\S]*$
          description: A general message about the exception
          readOnly: true
    Provider:
      type: string
      enum:
      - basic
      - custom
    UnauthorizedError:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
          pattern: ^[\s|\S]*$
          description: A general message about the exception
          readOnly: true
    UnexpectedError:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
          pattern: ^[\s|\S]*$
          description: A general message about the exception
          readOnly: true
    DomainSuspensionDetails:
      type: object
      required:
      - reasonCode
      properties:
        reasonCode:
          type: string
          enum:
          - raaVerification
          - abuse
          - promoAbuse
          - fraud
          - pendingAccountVerification
          - unauthorizedAccess
          - tosViolation
          - transferDispute
          - restrictedSecurity
          - lockCourt
          - suspendCourt
          - udrpUrs
          - restrictedLegal
          - paymentPending
          - unpaidService
          - restrictedWhois
          - lockedWhois
          example: raaVerification
          description: Suspension reason code
    DomainNameServersConfigurationResponse:
      type: object
      required:
      - hosts
      properties:
        hosts:
          type: array
          items:
            $ref: '#/components/schemas/fqdn'
          example:
          - ns1.exampledomain.com
          - ns2.exampledomain.com
          minItems: 2
          maxItems: 12
          description: A list of nameservers assigned to the domain. Each nameserver is provided in a fully qualified domain format.
      allOf:
      - $ref: '#/components/schemas/DomainNameServersConfigurationRequest'
    ForbiddenError:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
          pattern: ^[\s|\S]*$
          description: A general message about the exception
          readOnly: true
    ValidationError:
      type: object
      required:
      - detail
      - data
      properties:
        detail:
          type: string
          pattern: ^[\s|\S]*$
          description: A general message about the exception
          readOnly: true
        data:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: name
                pattern: ^[\s|\S]*$
                description: The path to the field that caused the validation error
                readOnly: true
              details:
                type: string
                example: The domain name contains invalid characters
                pattern: ^[\s|\S]*$
                description: A specific message about what is wrong with the field
                readOnly: true
            required:
            - field
            - details
          description: A detailed list of validation errors
          readOnly: true
    DomainNameServersConfigurationRequest:
      type: object
      required:
      - provider
      properties:
        provider:
          allOf:
          - $ref: '#/components/schemas/Provider'
          example: custom
          description: Nameservers provider
        hosts:
          type: array
          items:
            $ref: '#/components/schemas/fqdn'
          example:
          - ns1.exampledomain.com
          - ns2.exampledomain.com
          minItems: 2
          maxItems: 12
          description: 'A list of nameservers to be assigned to the domain. Each nameserver must be provided in a fully qualified domain format.

            This field must be specified only for the "custom" provider; for the "basic" provider it should be omitted.'
    errorCode:
      type: string
      maxLength: 255
      pattern: ^(business|application|infrastructure)(\.[a-zA-Z]+)+$
      description: The dot-separated error code indicating the type of the problem occurred
    Domains.DomainRenewalRequestInfo:
      type: object
      required:
      - years
      - currentExpirationDate
      properties:
        years:
          type: integer
          format: int32
          example: 1
          minimum: 1
          maximum: 10
          description: Renewal years
        currentExpirationDate:
          allOf:
          - $ref: '#/components/schemas/isoDate'
          description: Current expiration date
      description: Parameters required to request a domain renewal
    contactId:
      type: string
      example: 1ZdMXpapqp9sle5dl8BlppTJXAzf5
      minLength: 27
      maxLength: 32
      pattern: '[a-zA-Z0-9]+'
      description: Contact ID
    DomainPrivacyLevel:
      type: string
      enum:
      - public
      - high
    DomainPrivacyOptions:
      type: object
      required:
      - level
      - userConsent
      properties:
        level:
          allOf:
          - $ref: '#/components/schemas/DomainPrivacyLevel'
          example: high
          description: 'Indicates the level of privacy protection. Set this property to "high" to enable privacy protection and hide your personal details, or to "public" to display your real contact information.

            When choosing the "public" level, the "userConsent" property must be set to true to confirm your explicit consent for making your contact information publicly available.


            Note: not all TLDs support "high" privacy protection level'
        userConsent:
          type: boolean
          example: true
          description: Indicates whether the user consents to the Public privacy settings
      description: Privacy protection options. This parameter controls the visibility of your domain registrant contact information in the public WHOIS database.
    DomainCreateRequest:
      type: object
      required:
      - autoRenew
      - years
      - privacyProtection
      - contacts
      properties:
        autoRenew:
          type: boolean
          example: false
          description: Specifies whether automatic renewal will be enabled for the domain after the registration. After that, if autoRenew is set to true, the domain will be automatically renewed using the account’s default payment method upon each expiration
        years:
          type: integer
          format: int32
          example: 1
          minimum: 1
          maximum: 10
          description: Number of years to register the domain
        privacyProtection:
          $ref: '#/components/schemas/DomainPrivacyOptions'
        contacts:
          allOf:
          - $ref: '#/components/schemas/DomainContacts'
          example:
            registrant: 1ZdMXpapqp9sle5dl8BlppTJXAzf5
            admin: 1ZdMXpapqp9sle5dl8BlppTJXAzf6
            tech: 1ZdMXpapqp9sle5dl8BlppTJXAzf5
            billing: 1ZdMXpapqp9sle5dl8BlppTJXAzf5
            attributes:
            - 1ZdMXpapqp9sle5dl8BlppTJXAzf8
          description: Domain contacts are specified using contact IDs. These contact IDs can be obtained from the “Get domain info” endpoint (/domains) for an existing domain, or by creating new contacts through the “Save contact details” endpoint (/contacts). Each contact ID corresponds to a specific contact person and includes their details (such as name, address, and email). These contacts will be associated with the domain during registration.
    DomainInfo:
      type: object
      required:
      - name
      - unicodeName
      - isPremium
      - autoRenew
      - registrationDate
      - expirationDate
      - lifecycleStatus
      - verificationStatus
      - eppStatuses
      - suspensions
      - privacyProtection
      - nameservers
      - contacts
      properties:
        name:
          allOf:
          - $ref: '#/components/schemas/domainNameALabel'
          example: xn--spceship-9ya.com
        unicodeName:
          allOf:
          - $ref: '#/components/schemas/domainNameULabel'
          example: spaceship.com
        isPremium:
          type: boolean
          example: false
          description: Indicates whether the domain is premium
          readOnly: true
        autoRenew:
          type: boolean
          example: false
          description: Indicates whether the auto-renew option is enabled
          readOnly: true
        registrationDate:
          allOf:
          - $ref: '#/components/schemas/isoDate'
          description: The date when the domain was registered
          readOnly: true
        expirationDate:
          allOf:
          - $ref: '#/components/schemas/isoDate'
          description: The date when the domain registration expires
          readOnly: true
        lifecycleStatus:
          allOf:
          - $ref: '#/components/schemas/DomainLifecycleStatus'
          example: registered
          description: 'Current lifecycle status of the domain. Possible values are:


            * `creating` - The domain is being registered. This status means that the request has not yet been processed by the registry.

            * `registered` - The domain is registered.

            * `grace1` - The domain has expired but is still fully manageable.

            * `grace2` - The domain expired, parked, and its management is limited.

            * `redemption` - The domain has expired and may not be recoverable. If restoration is possible, an additional fee may apply.'
          readOnly: true
        verificationStatus:
          allOf:
          - $ref: '#/components/schemas/DomainVerificationStatus'
          nullable: true
          example: success
          description: Status of the RAA verification process. `null` if RAA procedure is not applied for the domain.
          readOnly: true
        eppStatuses:
          type: array
          items:
            $ref: '#/components/schemas/DomainClientEPPStatus'
          example:
          - clientTransferProhibited
          readOnly: true
        suspensions:
          type: array
          items:
            $ref: '#/components/schemas/DomainSuspensionDetails'
          maxItems: 2
          description: 'Information about domain suspensions.

            The array may be empty, contain details about one suspension (raaVerification, abuse, promoAbuse, fraud, pendingAccountVerification, unauthorizedAccess, tosViolation, transferDispute, restrictedSecurity, lockCourt, suspendCourt, udrpUrs, restrictedLegal, paymentPending, unpaidService, restrictedWhois, or lockedWhois), or up to two: one raaVerification and one legal (abuse, promoAbuse, fraud, pendingAccountVerification, unauthorizedAccess, tosViolation, transferDispute, restrictedSecurity, lockCourt, suspendCourt, udrpUrs, restrictedLegal, paymentPending, unpaidService, restrictedWhois, or lockedWhois).'
        privacyProtection:
          allOf:
          - $ref: '#/components/schemas/DomainPrivacyProtection'
          description: Information about domain privacy protection
        nameservers:
          allOf:
          - $ref: '#/components/schemas/DomainNameServersConfigurationResponse'
          example:
            provider: basic
            hosts:
            - ns1.exampledomain.com
            - ns2.exampledomain.com
          description: Information about nameservers
        contacts:
          allOf:
          - $ref: '#/components/schemas/DomainContacts'
          example:
            registrant: 1ZdMXpapqp9sle5dl8BlppTJXAzf5
            admin: 1ZdMXpapqp9sle5dl8BlppTJXAzf6
            tech: 1ZdMXpapqp9sle5dl8BlppTJXAzf5
            billing: 1ZdMXpapqp9sle5dl8BlppTJXAzf5
            attributes:
            - 1ZdMXpapqp9sle5dl8BlppTJXAzf8
    RateLimitError:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
          pattern: ^[\s|\S]*$
          description: A general message about the exception
          readOnly: true
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for authenticating requests, with a set of scopes (permissions) defined by the user at the time of creation.
    apiSecret:
      type: apiKey
      in: header
      name: X-API-Secret
      description: API secret for authenticating requests must be set together with the API key.
x-scopes:
  domains:read: Read domain information and check configuration
  domains:write: Manage domains and domain settings
  domains:transfer: Transfer domains in and out
  domains:billing: Manage domains billing operations
  contacts:write: Save contact details
  contacts:read: Read contact details
  dnsrecords:write: Write DNS resource records
  dnsrecords:read: Read DNS resource records
  asyncoperations:read: Read async operations details
  sellerhub:read: Read SellerHub Domains
  sellerhub:write: Write SellerHub Domains
x-tagGroups:
- name: Domains
  tags:
  - Domain Management
  - Domain Availability
  - Domain Settings
  - Personal Nameservers
  - Domain Transfer
- name: Contacts
  tags:
  - Contacts
  - Contacts attributes
- name: DNS
  tags:
  - DNS records
- name: SellerHub
  tags:
  - SellerHub
- name: Async Operations
  tags:
  - Async Operations
