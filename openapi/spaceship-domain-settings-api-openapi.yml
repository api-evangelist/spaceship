  /v1/domains/{domain}/nameservers:
    put:
      operationId: setDomainNameservers
      summary: Update domain nameservers
      description: 'Allows the modification of DNS settings for a specific domain by replacing its current nameservers with new ones.

        This operation is crucial to ensure that your domain points to the correct DNS servers, which is essential for routing traffic accurately and implementing changes in DNS management.


        ### Required Permissions


        - domains:write


        ### Rate Limits


        * The limit for updating nameservers for a domain is 5 requests per domain, within 300 seconds.'
      parameters:
      - name: domain
        in: path
        required: true
        description: The domain whose nameservers should be updated. The domain name must be provided in a fully qualified domain format.
        schema:
          type: string
          example: spaceship.com
          minLength: 4
          maxLength: 255
          format: domain
          description: Domain name in UTF-8 or ASCII format (U-label or A-label)
      responses:
        '200':
          description: Nameservers updated successfully. The response confirms that the domain's DNS settings have been modified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainNameServersConfigurationResponse'
        '400':
          description: The request is invalid.
