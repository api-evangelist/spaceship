components:
  schemas:
    ipAddress:
      type: string
      maxLength: 39
      format: ip
      description: An IP address represented as a string, which can be either IPv4 or IPv6 format.
    PersonalNameserverRecord:
      type: object
      required:
      - host
      - ips
      properties:
        host:
          allOf:
          - $ref: '#/components/schemas/host'
          example: ns1
          description: The host name of the personal nameserver
        ips:
          type: array
          items:
            $ref: '#/components/schemas/ipAddress'
          example:
          - 127.2.2.2
          - 12.22.22.21
          minItems: 1
          maxItems: 16
          description: List of IP addresses associated with the personal nameserver host
    HostNameServers:
      type: object
      required:
      - ips
      properties:
        ips:
          type: array
          items:
            $ref: '#/components/schemas/ipAddress'
          example:
          - 127.2.2.2
          - 12.22.22.21
          maxItems: 255
    operationId:
      type: string
      maxLength: 16
      pattern: ^[a-z0-9]{16}$
      description: 16-characters unique identifier of the operation
    RateLimitError:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
          pattern: ^[\s|\S]*$
          description: A general message about the exception
          readOnly: true
    PersonalNameservers:
      type: object
      required:
      - records
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/PersonalNameserverRecord'
          example:
          - host: ns1
            ips:
            - 127.0.0.1
            - 127.0.0.2
          - host: ns2
            ips:
            - 2001:0db8:85a3:0000:0000:8a2e:0370:7334
          minItems: 1
          maxItems: 255
          description: List of hosts and IP addresses associated with the personal nameservers
    ForbiddenError:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
          pattern: ^[\s|\S]*$
          description: A general message about the exception
          readOnly: true
    ValidationError:
      type: object
      required:
      - detail
      - data
      properties:
        detail:
          type: string
          pattern: ^[\s|\S]*$
          description: A general message about the exception
          readOnly: true
        data:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: name
                pattern: ^[\s|\S]*$
                description: The path to the field that caused the validation error
                readOnly: true
              details:
                type: string
                example: The domain name contains invalid characters
                pattern: ^[\s|\S]*$
                description: A specific message about what is wrong with the field
                readOnly: true
            required:
            - field
            - details
          description: A detailed list of validation errors
          readOnly: true
    ObjectNotFoundError:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
          pattern: ^[\s|\S]*$
          description: A general message about the exception
          readOnly: true
    host:
      type: string
      example: api.www
      minLength: 1
      maxLength: 255
      format: hostname
    ErrorDetail:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
          pattern: ^[\s|\S]*$
          description: A general message about the exception
          readOnly: true
    errorCode:
      type: string
      maxLength: 255
      pattern: ^(business|application|infrastructure)(\.[a-zA-Z]+)+$
      description: The dot-separated error code indicating the type of the problem occurred
    UnauthorizedError:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
          pattern: ^[\s|\S]*$
          description: A general message about the exception
          readOnly: true
    UnexpectedError:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
          pattern: ^[\s|\S]*$
          description: A general message about the exception
          readOnly: true
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for authenticating requests, with a set of scopes (permissions) defined by the user at the time of creation.
    apiSecret:
      type: apiKey
      in: header
      name: X-API-Secret
      description: API secret for authenticating requests must be set together with the API key.
