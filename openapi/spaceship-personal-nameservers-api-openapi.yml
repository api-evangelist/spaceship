    put:
      operationId: updateDomainPersonalNameserverHostInfo
      summary: Update personal nameservers host configuration
      description: 'Update the configuration for personal nameservers associated with a specific domain.


        **If the host in the request body differs from the host in the path, this operation will rename the host and update the IP addresses, making the old host return a 404.**


        Personal nameservers are a combination of A records set for a specific host and glue records set for the domain on the registry.


        ### Required Permissions


        - domains:write


        ### Rate Limits


        * The limit for updating the personal nameservers for a domain is 10 requests per domain, within 300 seconds.'
      parameters:
      - name: domain
        in: path
        required: true
        description: The domain name in fully qualified format whose nameserver configuration should be updated
        schema:
          type: string
          example: spaceship.com
          minLength: 4
          maxLength: 255
          format: domain
          description: Domain name in UTF-8 or ASCII format (U-label or A-label)
      - name: currentHost
        in: path
        required: true
        description: The host name part of the nameserver. For example, for `spaceship.dev` domain and `ns1.spaceship.dev` fully qualified name, the host is `ns1`.
        schema:
          type: string
          example: api.www
          minLength: 1
          maxLength: 255
          format: hostname
      responses:
        '200':
          description: Domain personal nameservers host is successfully updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalNameserverRecord'
        '400':
          description: The request is invalid.
          headers:
            spaceship-error-code:
              required: true
              schema:
                $ref: '#/components/schemas/errorCode'
            spaceship-operation-id:
              required: true
              schema:
                $ref: '#/components/schemas/operationId'
          content:
