    post:
      operationId: createSafePayTransaction
      summary: Create a SafePay transaction
      description: "Opens a SafePay (escrow) transaction for a domain sale. The endpoint returns immediately; the counterparty confirms out of band.\n\nThe initiator role is stated via `initiatedBy` (`seller`, `buyer`, or `broker`). The returned `status` shows which side must still act (`pendingSellerConfirm` or `pendingBuyerConfirm`), or `active` when no confirmation remains.\n\n### Broker flow\nWhen `initiatedBy=broker`, the authenticated caller is the broker acting on behalf of both parties:\n- Provide the seller via `sellerEmail` or `sellerUsername`, and optionally the buyer via `buyerEmail` or `buyerUsername`.\n- Use `confirmedBy` to pre-confirm the seller and/or buyer at creation, skipping their confirmation step.\n\n### Notes\n- `basePrice` is required for both types: for `buyNow` it is the amount the buyer pays; for `leaseToOwn` it is the lease total from which the plan is derived, and `ltoSettings` then supplies `downPaymentPercentage` + `installmentPeriods`. Omitting the field required for the chosen `type` returns a `400 Bad Request`.\n- **Minimum payment:** every payment must be at least 100 (in the given currency) — for `buyNow` that is `basePrice`; for `leaseToOwn` it is the derived down payment and each installment. A plan that produces any payment below 100 returns a `400 Bad Request`.\n- `feePercentageShare` sets how the marketplace commission is split between seller and buyer.\n- **`paymentMethod`:** required when the buyer commits upfront without a later confirmation step — i.e. `initiatedBy=buyer`, or a broker pre-confirming the buyer (`confirmedBy.buyer=true`); omitting it then returns `400 Bad Request`. Omit it in every other flow.\n- **Conflict (`409`):** returned when the domain already has an agreement to sell in place (an accepted offer / agreement-reached lead). Complete or cancel that agreement before opening a SafePay transaction for the domain.\n\n### Required Permissions \n\n - <a href=\"#scopes/sellerhub:write\">sellerhub:write</a>\n\n### Rate Limits \n\n * The limit for creating a SafePay transaction is 300 requests per user, within 300 seconds."
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafePayTransaction'
        '400':
