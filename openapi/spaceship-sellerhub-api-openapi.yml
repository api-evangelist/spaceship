          format: int32
          minimum: 1
          maximum: 100
        explode: false
      - name: skip
        in: query
        required: true
        description: Number of response items to skip
        schema:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
        explode: false
      responses:
        '200':
          description: Seller Hub Domains List
