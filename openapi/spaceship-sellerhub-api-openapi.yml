  /v1/sellerhub/verification-records:
    get:
      operationId: getVerificationRecords
      summary: Get verification records
      description: "Returns verification options for domain ownership verification in SellerHub.\n\nThe response contains one or more verification options. You can choose ANY of the returned options\n(OR logic) that works best for your DNS setup. Within a chosen option, ALL records must\nbe created (AND logic).\n\n**Important:** The returned verification records are associated with your SellerHub account\nand can be used to verify ownership of ALL domains you want to add to SellerHub. You only\nneed to create these DNS records once per account, not separately for each domain.\n\n**Usage:**\n1. Call this endpoint to retrieve verification options\n2. Select ONE option from `options` array\n3. Create ALL DNS records listed in your selected option's `records` array on any domain\n4. Wait for DNS propagation; the system will verify your domain\n5. The same records can be used for verifying additional domains in your SellerHub account\n\nThis verification process is required for adding external domains to SellerHub.\n\n### Required Permissions \n\n - <a href=\"#scopes/sellerhub:read\">sellerhub:read</a>\n\n### Rate Limits \n\n * The limit for fetching verification records is 10 requests per user, within 60 seconds."
