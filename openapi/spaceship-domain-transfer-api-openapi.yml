components:
  schemas:
    isoDate:
      type: string
      example: '2100-01-01T00:00:00.000Z'
      maxLength: 27
      format: date-time
      description: ISO-8601 DateTime
    errorCode:
      type: string
      maxLength: 255
      pattern: ^(business|application|infrastructure)(\.[a-zA-Z]+)+$
      description: The dot-separated error code indicating the type of the problem occurred
    Domains.DomainAuthCodeResponse:
      type: object
      required:
      - authCode
      - expires
      properties:
        authCode:
          $ref: '#/components/schemas/authCode'
        expires:
          allOf:
          - $ref: '#/components/schemas/isoDate'
          description: The expiration date for the auth code
          readOnly: true
      description: Represents wrapper object for auth code response
    RateLimitError:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
          pattern: ^[\s|\S]*$
          description: A general message about the exception
          readOnly: true
    DomainPrivacyOptions:
      type: object
      required:
      - level
      - userConsent
      properties:
        level:
          allOf:
          - $ref: '#/components/schemas/DomainPrivacyLevel'
          example: high
          description: 'Indicates the level of privacy protection. Set this property to "high" to enable privacy protection and hide your personal details, or to "public" to display your real contact information.

            When choosing the "public" level, the "userConsent" property must be set to true to confirm your explicit consent for making your contact information publicly available.


            Note: not all TLDs support "high" privacy protection level'
        userConsent:
          type: boolean
          example: true
          description: Indicates whether the user consents to the Public privacy settings
      description: Privacy protection options. This parameter controls the visibility of your domain registrant contact information in the public WHOIS database.
    contactId:
      type: string
      example: 1ZdMXpapqp9sle5dl8BlppTJXAzf5
      minLength: 27
      maxLength: 32
      pattern: '[a-zA-Z0-9]+'
      description: Contact ID
    DomainContacts:
      type: object
      required:
      - registrant
      properties:
        registrant:
          allOf:
          - $ref: '#/components/schemas/contactId'
          description: ID of the registrant contact person
        admin:
          allOf:
          - $ref: '#/components/schemas/contactId'
          description: ID of the admin contact person
        tech:
          allOf:
          - $ref: '#/components/schemas/contactId'
          description: ID of the technical contact person
        billing:
          allOf:
          - $ref: '#/components/schemas/contactId'
          description: ID of the billing contact person
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/contactId'
          example:
          - 1ZdMXpapqp9sle5dl8BlppTJXAzf3
          - 1ZdMXpapqp9sle5dl8BlppTJXAzf2
          maxItems: 5
          description: List of extended attribute contact point IDs
      description: Domain Contacts presented as ID references
    authCode:
      type: string
      example: abc@#$123%^&def
      minLength: 1
      maxLength: 50
      pattern: ^.+$
      description: Authorization code for the domain
    DomainPrivacyLevel:
      type: string
      enum:
      - public
      - high
    UnexpectedError:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
          pattern: ^[\s|\S]*$
          description: A general message about the exception
          readOnly: true
    DomainTransferStatus:
      type: string
      enum:
      - pending
      - completed
      - cancelled
      description: 'Status of the domain name transfer. Possible values are:

        * `pending` - transfer is ongoing

        * `completed` - transfer was completed

        * `cancelled` - transfer request was cancelled by loosing party'
    ValidationError:
      type: object
      required:
      - detail
      - data
      properties:
        detail:
          type: string
          pattern: ^[\s|\S]*$
          description: A general message about the exception
          readOnly: true
        data:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: name
                pattern: ^[\s|\S]*$
                description: The path to the field that caused the validation error
                readOnly: true
              details:
                type: string
                example: The domain name contains invalid characters
                pattern: ^[\s|\S]*$
                description: A specific message about what is wrong with the field
                readOnly: true
            required:
            - field
            - details
          description: A detailed list of validation errors
          readOnly: true
    ObjectNotFoundError:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
          pattern: ^[\s|\S]*$
          description: A general message about the exception
          readOnly: true
    ErrorDetail:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
          pattern: ^[\s|\S]*$
          description: A general message about the exception
          readOnly: true
    UnauthorizedError:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
          pattern: ^[\s|\S]*$
          description: A general message about the exception
          readOnly: true
    DomainTransferRequest:
      type: object
      required:
      - autoRenew
      - privacyProtection
      - contacts
      properties:
        autoRenew:
          type: boolean
          example: false
          description: Specifies whether automatic renewal will be enabled for the domain after the transfer is completed. After that, if autoRenew is set to true, the domain will be automatically renewed using the account’s default payment method upon each expiration
        privacyProtection:
          $ref: '#/components/schemas/DomainPrivacyOptions'
        contacts:
          allOf:
          - $ref: '#/components/schemas/DomainContacts'
          example:
            registrant: 1ZdMXpapqp9sle5dl8BlppTJXAzf5
            admin: 1ZdMXpapqp9sle5dl8BlppTJXAzf6
            tech: 1ZdMXpapqp9sle5dl8BlppTJXAzf5
            billing: 1ZdMXpapqp9sle5dl8BlppTJXAzf5
            attributes:
            - 1ZdMXpapqp9sle5dl8BlppTJXAzf8
          description: Domain contacts are specified using contact IDs. These contact IDs can be obtained from the “Get domain info” endpoint (/domains) for an existing domain, or by creating new contacts through the “Save contact details” endpoint (/contacts). Each contact ID corresponds to a specific contact person and includes their details (such as name, address, and email). These contacts will be associated with the domain after transfer.
        authCode:
          allOf:
          - $ref: '#/components/schemas/authCode'
          description: Authorization code (EPP code) required for domain transfers. This code is mandatory for most TLDs but may be optional for certain ccTLDs, for example, the .uk.
    ForbiddenError:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
          pattern: ^[\s|\S]*$
          description: A general message about the exception
          readOnly: true
    Domains.DomainTransferLock:
      type: object
      required:
      - isLocked
      properties:
        isLocked:
          type: boolean
          example: true
          description: Describes transfer lock for the domain
      description: Represents wrapper object for transfer lock
    operationId:
      type: string
      maxLength: 16
      pattern: ^[a-z0-9]{16}$
      description: 16-characters unique identifier of the operation
    Domains.DomainTransferDetailsResponse:
      type: object
      required:
      - startedAt
      - direction
      - status
      properties:
        startedAt:
          allOf:
          - $ref: '#/components/schemas/isoDate'
          description: Date when transfer was initiated
        finishedAt:
          allOf:
          - $ref: '#/components/schemas/isoDate'
          description: Date when transfer was finished
        direction:
          type: string
          enum:
          - in
          description: 'Transfer direction: incoming'
        status:
          allOf:
          - $ref: '#/components/schemas/DomainTransferStatus'
          readOnly: true
      description: Details of the domain name transfer
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for authenticating requests, with a set of scopes (permissions) defined by the user at the time of creation.
    apiSecret:
      type: apiKey
      in: header
      name: X-API-Secret
      description: API secret for authenticating requests must be set together with the API key.
x-scopes:
  domains:read: Read domain information and check configuration
  domains:write: Manage domains and domain settings
  domains:transfer: Transfer domains in and out
  domains:billing: Manage domains billing operations
  contacts:write: Save contact details
  contacts:read: Read contact details
  dnsrecords:write: Write DNS resource records
  dnsrecords:read: Read DNS resource records
  asyncoperations:read: Read async operations details
  sellerhub:read: Read SellerHub Domains
  sellerhub:write: Write SellerHub Domains
x-tagGroups:
- name: Domains
  tags:
  - Domain Management
  - Domain Availability
  - Domain Settings
  - Personal Nameservers
  - Domain Transfer
- name: Contacts
  tags:
  - Contacts
  - Contacts attributes
- name: DNS
  tags:
  - DNS records
- name: SellerHub
  tags:
  - SellerHub
- name: Async Operations
  tags:
  - Async Operations
