aid: spaceship
name: Spaceship
description: >-
  Spaceship is a domain registrar and domain marketplace offering domain registration, DNS
  management, WHOIS privacy protection, and a SellerHub resale marketplace with SafePay escrow. Its
  public REST API (https://spaceship.dev/api, v1) exposes 40 operations across domain management,
  availability, settings, transfers, personal nameservers, contacts, DNS records, SellerHub, and
  asynchronous operations. Authentication uses a paired API key and secret (X-API-Key / X-API-Secret)
  with per-key scopes; long-running actions use an async-operation polling model (202 + a
  spaceship-async-operationid header polled at /v1/async-operations/{operationId}).
